name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC to refresh social feeds

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-instagram-token:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Refresh Instagram token
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_APP_SECRET" ]; then
            echo "⚠️  Instagram secrets not configured, skipping refresh"
            exit 0
          fi

          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_ACCESS_TOKEN")

          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ Token refresh failed:"
            echo "$RESPONSE"
            exit 1
          fi

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$NEW_TOKEN" = "null" ] || [ -z "$NEW_TOKEN" ]; then
            echo "❌ No token in response"
            exit 1
          fi
          echo "::add-mask::$NEW_TOKEN"

          # Update the repository secret via GitHub API
          if [ -z "$TOKEN_UPDATER_PAT" ]; then
            echo "⚠️  TOKEN_UPDATER_PAT not configured — cannot auto-update secret"
            exit 1
          fi

          KEY_RESPONSE=$(curl -s -H "Authorization: token $TOKEN_UPDATER_PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key")
          KEY_ID=$(echo "$KEY_RESPONSE" | jq -r '.key_id')
          PUBLIC_KEY=$(echo "$KEY_RESPONSE" | jq -r '.key')

          pip install pynacl -q
          ENCRYPTED=$(python3 -c "
          import base64
          from nacl import encoding, public
          pk = public.PublicKey('$PUBLIC_KEY'.encode('utf-8'), encoding.Base64Encoder())
          sealed_box = public.SealedBox(pk)
          encrypted = sealed_box.encrypt('$NEW_TOKEN'.encode('utf-8'))
          print(base64.b64encode(encrypted).decode('utf-8'))
          ")

          curl -s -X PUT \
            -H "Authorization: token $TOKEN_UPDATER_PAT" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets/INSTAGRAM_ACCESS_TOKEN" \
            -d "{\"encrypted_value\":\"$ENCRYPTED\",\"key_id\":\"$KEY_ID\"}"

          echo "✅ Instagram token refreshed and secret updated"
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TOKEN_UPDATER_PAT: ${{ secrets.TOKEN_UPDATER_PAT }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLUB_ID: "110633"
          SITE_URL: "https://neil-armstrong-fig.github.io/TQCC"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping IndexNow with changed URLs
        run: |
          INDEXNOW_KEY=$(cat public/b787f745-3c70-48eb-9abf-159e5e4607b4.txt)

          # Get list of changed content files from the push
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/' 'src/content/' 2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No content changes detected, submitting homepage only"
            URLS='["https://www.titanicquartercc.com/"]'
          else
            # Map changed files to site URLs
            URLS="["
            FIRST=true

            for FILE in $CHANGED_FILES; do
              URL=""
              case "$FILE" in
                src/pages/index.astro) URL="https://www.titanicquartercc.com/" ;;
                src/pages/*.astro)
                  SLUG=$(basename "$FILE" .astro)
                  URL="https://www.titanicquartercc.com/${SLUG}/"
                  ;;
                src/content/events/*)
                  SLUG=$(basename "$FILE" .md)
                  URL="https://www.titanicquartercc.com/events/${SLUG}/"
                  ;;
                src/content/newsletters/*)
                  SLUG=$(basename "$FILE" .md)
                  URL="https://www.titanicquartercc.com/newsletters/${SLUG}/"
                  ;;
              esac

              if [ -n "$URL" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  URLS+=","
                fi
                URLS+="\"${URL}\""
              fi
            done

            URLS+="]"
          fi

          echo "Submitting URLs: $URLS"

          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"www.titanicquartercc.com\",
              \"key\": \"${INDEXNOW_KEY}\",
              \"keyLocation\": \"https://www.titanicquartercc.com/b787f745-3c70-48eb-9abf-159e5e4607b4.txt\",
              \"urlList\": ${URLS}
            }"

          echo "✅ IndexNow submission complete"

  trigger-netlify:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger Netlify Build
        run: |
          if [ -n "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            curl -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"
            echo "✅ Netlify build triggered"
          else
            echo "⚠️  NETLIFY_BUILD_HOOK secret not configured"
          fi
